name: Tikk
options:
  bundleIdPrefix: nl.littleworks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: nl
packages:
  LittleWorksCore:
    path: ../../Packages/LittleWorksCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Tikk:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: LittleWorksCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: tikk.
        LSUIElement: true
        CFBundleLocalizations: [en, nl]
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.littleworks.tikk
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
