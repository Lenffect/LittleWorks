name: Tikk
options:
  bundleIdPrefix: nl.littleworks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: nl
packages:
  LittleWorksCore:
    path: ../../Packages/LittleWorksCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Tikk:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: LittleWorksCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: tikk.
        LSUIElement: true
        CFBundleLocalizations: [en, nl]
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.littleworks.tikk
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TikkiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        includes:
          - AppModel.swift
          - AutoBackup.swift
          - Backup.swift
          - Brand.swift
          - DayGroups.swift
          - Language.swift
          - NotePrompt.swift
          - Persistence.swift
          - Reminder.swift
          - Urencriterium.swift
          - ProjectStatusBlock.swift
          - XLSXExport.swift
      - SourcesiOS
      - Resources
    dependencies:
      - package: LittleWorksCore
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: tikk.
        CFBundleLocalizations: [en, nl]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.productivity
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.littleworks.tikk.ios
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
